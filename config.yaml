account:
  account_size: 10000
  risk_per_trade_pct: 1.0
  max_positions: 6
  max_sector_pct: 30

data:
  db_path: data/swing.db
  price_history_years: 3
  tickers:
    - SPY
    - "^VIX"

macro_regime:
  vix_calm_max: 25
  vix_panic_min: 35
  spy_trend_ma_days: 200

fundamental:
  roic_min: 10.0
  fcf_margin_min: 5.0
  revenue_growth_min: 5.0
  earnings_growth_min: 10.0
  relative_strength_min: 70.0
  relative_strength_preferred: 80.0
  price_min: 10.0
  avg_volume_min: 500000
  ttl_days: 7
  rs_lookback_days: 252
  excluded_setups:
    - BREAKOUT
  universe:
    - SPY
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - JPM
    - JNJ
    - PG

technical:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  atr_period: 14
  atr_stop_multiplier: 2.0
  volume_avg_window: 20
  pullback_tolerance_pct: 1.5
  pullback_rsi_max: 70.0
  breakout_min_days: 15
  breakout_max_days: 40
  breakout_width_min_pct: 5.0
  breakout_width_max_pct: 15.0
  breakout_volume_multiplier: 1.5
  failed_breakdown_support_window: 20
  failed_breakdown_volume_multiplier: 1.5
  failed_breakdown_recovery_days: 2

risk:
  reduce_size_after_losses: 3
  reduce_size_multiplier: 0.5
  breakeven_r: 1.0
  partial_exit_1_r: 2.0
  partial_exit_1_pct: 50
  partial_exit_2_r: 3.0
  partial_exit_2_pct: 25
  trail_remaining_pct: 25
  trail_ema_days: 10
  trail_atr_multiplier: 2.0
  time_stop_days: 5

backtest:
  # Backtest-only universe, separate from fundamental.universe (live RS calc).
  # 30 liquid large caps across sectors: Tech, Financials, Healthcare, Consumer, Industrials, Energy.
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - AMD
    - AVGO
    - CRM
    - ADBE
    - JPM
    - BAC
    - V
    - MA
    - GS
    - JNJ
    - UNH
    - LLY
    - ABBV
    - PG
    - KO
    - WMT
    - COST
    - HD
    - NKE
    - CAT
    - HON
    - UPS
    - XOM
    - CVX
