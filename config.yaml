account:
  account_size: 10000
  risk_per_trade_pct: 1.0
  max_positions: 6
  max_sector_pct: 30

data:
  db_path: data/swing.db
  price_history_years: 3
  tickers:
    - SPY
    - "^VIX"

macro_regime:
  vix_calm_max: 25
  vix_panic_min: 35
  spy_trend_ma_days: 200

fundamental:
  roic_min: 10.0
  fcf_margin_min: 5.0
  revenue_growth_min: 5.0
  earnings_growth_min: 10.0
  relative_strength_min: 70.0
  relative_strength_preferred: 80.0
  price_min: 10.0
  avg_volume_min: 500000
  ttl_days: 7
  rs_lookback_days: 252
  universe:
    - SPY
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - JPM
    - JNJ
    - PG

